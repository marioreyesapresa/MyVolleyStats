{% if user.is_staff %}
{% url 'admin:index' as admin_index_url %}
<a href="{{ admin_index_url }}" class="flex items-center space-x-3 p-3 rounded-xl hover:bg-white/5 transition-all {% if admin_index_url in request.path %}sidebar-active-dark{% else %}text-slate-400{% endif %}">
    <i data-lucide="shield" class="w-5 h-5 {% if admin_index_url in request.path %}text-emerald-400{% else %}text-slate-400{% endif %}"></i>
    <span class="font-medium text-sm">Panel Django Admin</span>
</a>
{% endif %}
